name: AI Service CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  
jobs:

  # =====================================================
  # CI
  # GitHub-hosted Runner에서 코드 검사
  # =====================================================

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall .


  # =====================================================
  # CD
  # 학생 PC Self-hosted Runner에서 H200 배포
  # =====================================================

  deploy:

    needs: test

    runs-on:
      - self-hosted
      - Windows
      - X64
      - h200-deploy

    timeout-minutes: 20

    steps:

      # ----------------------------------------------
      # H200 접속 확인
      # ----------------------------------------------

      - name: Check H200 connection
        shell: powershell

        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=10 h200 "echo SSH_OK && whoami && hostname"

      # === 👇 추가해야 할 부분: 코드 체크아웃, 압축 및 전송 👇 ===
      - name: Checkout repository 
        uses: actions/checkout@v7

      - name: Compress project files
        shell: powershell
        run: |
          tar -cvf deploy.tar .

      - name: Transfer to H200
        shell: powershell
        run: |
          scp -o BatchMode=yes deploy.tar h200:~/deploy.tar
      # === 👆 여기까지 추가 👆 ===

      # ----------------------------------------------
      # H200 배포
      # ----------------------------------------------

      - name: Deploy Docker containers
        shell: powershell
        run: |
          ssh -o BatchMode=yes h200 "rm -rf ~/llm/ai-agent-deploy-project && mkdir -p ~/llm/ai-agent-deploy-project && tar -xf ~/deploy.tar -C ~/llm/ai-agent-deploy-project && cp ~/llm/.h200-deploy/.env ~/llm/ai-agent-deploy-project/.env && rm ~/deploy.tar && cd ~/llm/ai-agent-deploy-project && docker compose up -d --build"

      # ---------------------------------------------------
      # 6. 실행 결과 확인
      # ---------------------------------------------------
      - name: Check containers
        shell: powershell

        run: |
          ssh -o BatchMode=yes h200 "cd ~/llm/ai-agent-deploy-project && docker compose ps"
