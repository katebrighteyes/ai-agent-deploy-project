name: AI Service CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  # =====================================================
  # CI
  # GitHub-hosted Runner에서 코드 검사
  # =====================================================

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall .


  # =====================================================
  # CD
  # 학생 PC Self-hosted Runner에서 H200 배포
  # =====================================================

  deploy:

    needs: test

    runs-on:
      - self-hosted
      - Windows
      - X64
      - h200-deploy

    timeout-minutes: 20

    steps:

      # ----------------------------------------------
      # H200 접속 확인
      # ----------------------------------------------

      - name: Check H200 connection
        shell: powershell

        run: |
          ssh -o BatchMode=yes h200 "echo SSH_OK && whoami && hostname"


      # ----------------------------------------------
      # H200 배포
      # ----------------------------------------------

      - name: Deploy
        shell: powershell

        run: |
          ssh -o BatchMode=yes h200 "cd ~/llm/agent-deploy-project && git pull origin main && docker compose up -d --build && docker compose ps"
